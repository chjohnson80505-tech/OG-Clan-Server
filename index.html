<!DOCTYPE html>
<html>
<head>
    <title>Plans</title>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<button onclick="buyPlan('daily')">Daily</button>
<button onclick="buyPlan('weekly')">Weekly</button>
<button onclick="buyPlan('monthly')">Monthly</button>
<button onclick="buyPlan('six_months')">6 Months</button>
<button onclick="buyPlan('yearly')">Yearly</button>

<script>

const stripe = Stripe("pk_live_YOUR_PUBLIC_KEY");

async function buyPlan(planId) {

    const res = await fetch("https://YOUR-BACKEND.onrender.com/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ planId })
    });

    const data = await res.json();

    if (data.url) {
        window.location.href = data.url;
    } else {
        alert("Error");
    }
}

</script>

</body>
</html>
